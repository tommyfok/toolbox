<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolbox · 在线工具箱</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#818cf8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 20% 0%, #1e1b4b 0%, var(--bg) 55%); color: var(--text);
    display: flex; justify-content: center; padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 980px; }
  h1 { margin: 0 0 6px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  a.tool {
    display: block; padding: 20px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
    color: inherit; text-decoration: none; transition: .15s;
  }
  a.tool:hover { border-color: var(--accent); transform: translateY(-2px); }
  .icon { font-size: 28px; margin-bottom: 10px; }
  .name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .desc { font-size: 13px; color: var(--muted); line-height: 1.5; }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧰 Toolbox</h1>
  <p class="sub">纯前端在线小工具，数据只在你的浏览器里处理。</p>
  <div class="grid">
    <a class="tool" href="text2qrcode/">
      <div class="icon">🔳</div>
      <div class="name">Text → QR Code</div>
      <div class="desc">把文本或网址生成二维码，支持纠错等级、颜色、尺寸，导出 PNG / SVG。</div>
    </a>
  </div>
  <footer>更多工具陆续添加中</footer>
</div>
</body>
</html>
