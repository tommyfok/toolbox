<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text → QR Code</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --line: #334155; --text: #e2e8f0;
    --muted: #94a3b8; --accent: #6366f1; --accent2: #818cf8; --err: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 20% 0%, #1e1b4b 0%, var(--bg) 55%); color: var(--text);
    display: flex; justify-content: center; padding: 40px 16px;
  }
  .wrap { width: 100%; max-width: 980px; }
  h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: .5px; }
  .back { display: inline-block; margin-bottom: 14px; color: var(--muted); font-size: 13px; text-decoration: none; }
  .back:hover { color: var(--accent2); }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 180px; resize: vertical; padding: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #0b1220; color: var(--text); font-size: 15px; line-height: 1.5;
    font-family: inherit; outline: none;
  }
  textarea:focus, select:focus, input:focus { border-color: var(--accent2); }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .meta .err { color: var(--err); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  select, input[type=number] {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: #0b1220; color: var(--text); font-size: 14px; outline: none;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: #0b1220; padding: 2px; cursor: pointer; }
  .preview { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .canvas-box {
    width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    background: repeating-conic-gradient(#273449 0% 25%, #1e293b 0% 50%) 50% / 20px 20px;
    border-radius: 12px; border: 1px solid var(--line); overflow: hidden;
  }
  canvas { max-width: 92%; max-height: 92%; image-rendering: pixelated; border-radius: 4px; }
  .placeholder { color: var(--muted); font-size: 14px; }
  .info { font-size: 12px; color: var(--muted); text-align: center; min-height: 16px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 100%; }
  button {
    padding: 10px 8px; border-radius: 9px; border: 1px solid var(--line); background: #0b1220;
    color: var(--text); font-size: 14px; cursor: pointer; transition: .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent2); background: #151f38; }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: var(--accent2); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px);
    background: #111827; border: 1px solid var(--line); padding: 10px 18px; border-radius: 10px;
    opacity: 0; transition: .25s; pointer-events: none; font-size: 14px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { margin-top: 18px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 返回工具箱</a>
  <h1>Text → QR Code</h1>
  <p class="sub">纯前端生成二维码，内容不会离开你的浏览器。支持中文、网址、任意文本。</p>

  <div class="grid">
    <div class="card">
      <label for="text">输入文本</label>
      <textarea id="text" placeholder="在这里输入文本或网址…" autofocus>https://example.com</textarea>
      <div class="meta"><span id="count">0 字节</span><span id="status"></span></div>

      <div class="opts">
        <div>
          <label for="ecl">纠错等级</label>
          <select id="ecl">
            <option value="0">L — 7%</option>
            <option value="1" selected>M — 15%</option>
            <option value="2">Q — 25%</option>
            <option value="3">H — 30%</option>
          </select>
        </div>
        <div>
          <label for="margin">留白（模块数）</label>
          <input type="number" id="margin" min="0" max="10" value="4">
        </div>
        <div>
          <label for="fg">前景色</label>
          <input type="color" id="fg" value="#000000">
        </div>
        <div>
          <label for="bg">背景色</label>
          <input type="color" id="bg" value="#ffffff">
        </div>
        <div style="grid-column: 1 / -1">
          <label for="scale">导出尺寸：<span id="scaleVal"></span></label>
          <input type="range" id="scale" min="2" max="30" value="10">
        </div>
      </div>
    </div>

    <div class="card preview">
      <div class="canvas-box">
        <canvas id="canvas"></canvas>
        <span class="placeholder" id="ph" hidden>输入内容后显示二维码</span>
      </div>
      <div class="info" id="info"></div>
      <div class="btns">
        <button class="primary" id="dlPng">下载 PNG</button>
        <button id="dlSvg">下载 SVG</button>
        <button id="copy">复制图片</button>
      </div>
    </div>
  </div>
  <footer>内置 QR 编码器（ISO/IEC 18004，字节模式 UTF-8，版本 1–40），离线可用</footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== QR 编码器（参考 Nayuki qrcodegen 算法实现） ===================== */
const QR = (() => {
  const ECC_PER_BLOCK = [
    [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
  ];
  const NUM_BLOCKS = [
    [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81],
  ];
  const ECL_FORMAT = [1, 0, 3, 2]; // L M Q H

  const getBit = (x, i) => ((x >>> i) & 1) !== 0;

  function rawModules(ver) {
    let r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  const dataCodewords = (ver, ecl) =>
    Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ecl][ver] * NUM_BLOCKS[ecl][ver];

  // GF(256) / Reed-Solomon
  function gfMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11D);
      z ^= ((y >>> i) & 1) * x;
    }
    return z;
  }
  function rsDivisor(deg) {
    const r = new Array(deg).fill(0);
    r[deg - 1] = 1;
    let root = 1;
    for (let i = 0; i < deg; i++) {
      for (let j = 0; j < r.length; j++) {
        r[j] = gfMul(r[j], root);
        if (j + 1 < r.length) r[j] ^= r[j + 1];
      }
      root = gfMul(root, 0x02);
    }
    return r;
  }
  function rsRemainder(data, div) {
    const r = div.map(() => 0);
    for (const b of data) {
      const f = b ^ r.shift();
      r.push(0);
      div.forEach((c, i) => (r[i] ^= gfMul(c, f)));
    }
    return r;
  }

  function utf8(str) { return Array.from(new TextEncoder().encode(str)); }

  function encode(text, minEcl) {
    const bytes = utf8(text);
    let ver, ecl = minEcl;
    for (ver = 1; ver <= 40; ver++) {
      const ccBits = ver <= 9 ? 8 : 16;
      const used = 4 + ccBits + bytes.length * 8;
      if (used <= dataCodewords(ver, ecl) * 8) break;
    }
    if (ver > 40) throw new Error('文本过长，超出二维码最大容量');
    const ccBits = ver <= 9 ? 8 : 16;
    const usedBits = 4 + ccBits + bytes.length * 8;
    // 在不增大版本的前提下提升纠错等级
    for (let e = ecl + 1; e <= 3; e++) if (usedBits <= dataCodewords(ver, e) * 8) ecl = e;

    // 组装比特流
    const bb = [];
    const append = (val, len) => { for (let i = len - 1; i >= 0; i--) bb.push((val >>> i) & 1); };
    append(0b0100, 4);
    append(bytes.length, ccBits);
    bytes.forEach(b => append(b, 8));
    const cap = dataCodewords(ver, ecl) * 8;
    append(0, Math.min(4, cap - bb.length));
    append(0, (8 - bb.length % 8) % 8);
    for (let p = 0xEC; bb.length < cap; p ^= 0xEC ^ 0x11) append(p, 8);
    const data = [];
    for (let i = 0; i < bb.length; i += 8) {
      let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bb[i + j];
      data.push(v);
    }

    // 纠错码与交织
    const nBlocks = NUM_BLOCKS[ecl][ver], eccLen = ECC_PER_BLOCK[ecl][ver];
    const rawCw = Math.floor(rawModules(ver) / 8);
    const nShort = nBlocks - rawCw % nBlocks;
    const shortLen = Math.floor(rawCw / nBlocks);
    const div = rsDivisor(eccLen);
    const blocks = [];
    for (let i = 0, k = 0; i < nBlocks; i++) {
      const dat = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1));
      k += dat.length;
      const ecc = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const codewords = [];
    for (let i = 0; i < blocks[0].length; i++)
      blocks.forEach((b, j) => { if (i !== shortLen - eccLen || j >= nShort) codewords.push(b[i]); });

    // 矩阵
    const size = ver * 4 + 17;
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setF = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };

    for (let i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    const finder = (x, y) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < size && yy >= 0 && yy < size) setF(xx, yy, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);

    const alignPos = (() => {
      if (ver === 1) return [];
      const n = Math.floor(ver / 7) + 2;
      const step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
      const r = [6];
      for (let pos = size - 7; r.length < n; pos -= step) r.splice(1, 0, pos);
      return r;
    })();
    const na = alignPos.length;
    for (let i = 0; i < na; i++) for (let j = 0; j < na; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        setF(alignPos[i] + dx, alignPos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }

    const drawFormat = mask => {
      const d = (ECL_FORMAT[ecl] << 3) | mask;
      let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const bits = ((d << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setF(8, i, getBit(bits, i));
      setF(8, 7, getBit(bits, 6)); setF(8, 8, getBit(bits, 7)); setF(7, 8, getBit(bits, 8));
      for (let i = 9; i < 15; i++) setF(14 - i, 8, getBit(bits, i));
      for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, getBit(bits, i));
      for (let i = 8; i < 15; i++) setF(8, size - 15 + i, getBit(bits, i));
      setF(8, size - 8, true);
    };
    drawFormat(0);

    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const bits = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const b = getBit(bits, i), a = size - 11 + i % 3, c = Math.floor(i / 3);
        setF(a, c, b); setF(c, a, b);
      }
    }

    // 放置数据
    let bi = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let v = 0; v < size; v++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - v : v;
        if (!fn[y][x] && bi < codewords.length * 8) {
          mod[y][x] = getBit(codewords[bi >>> 3], 7 - (bi & 7));
          bi++;
        }
      }
    }

    const maskFn = [
      (x, y) => (x + y) % 2 === 0,
      (x, y) => y % 2 === 0,
      (x, y) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0,
      (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0,
    ];
    const applyMask = m => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
        if (!fn[y][x] && maskFn[m](x, y)) mod[y][x] = !mod[y][x];
    };

    const penalty = () => {
      let p = 0;
      const line = get => {
        let run = 1;
        for (let i = 1; i < size; i++) {
          if (get(i) === get(i - 1)) { run++; if (i === size - 1 && run >= 5) p += run - 2; }
          else { if (run >= 5) p += run - 2; run = 1; }
        }
        // 1:1:3:1:1 类定位图形
        const at = i => (i >= 0 && i < size ? get(i) : false);
        for (let i = -4; i < size; i++) {
          if (at(i) && !at(i + 1) && at(i + 2) && at(i + 3) && at(i + 4) && !at(i + 5) && at(i + 6)) {
            const before = !at(i - 1) && !at(i - 2) && !at(i - 3) && !at(i - 4);
            const after = !at(i + 7) && !at(i + 8) && !at(i + 9) && !at(i + 10);
            if (before) p += 40;
            if (after) p += 40;
          }
        }
      };
      for (let y = 0; y < size; y++) line(x => mod[y][x]);
      for (let x = 0; x < size; x++) line(y => mod[y][x]);
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
        const c = mod[y][x];
        if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) p += 3;
      }
      let dark = 0;
      mod.forEach(r => r.forEach(c => { if (c) dark++; }));
      const total = size * size;
      p += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
      return p;
    };

    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m); drawFormat(m);
      const p = penalty();
      if (p < bestP) { bestP = p; best = m; }
      applyMask(m);
    }
    applyMask(best); drawFormat(best);

    return { size, modules: mod, version: ver, ecl, mask: best, bytes: bytes.length };
  }

  return { encode };
})();

/* ===================== 页面逻辑 ===================== */
const $ = id => document.getElementById(id);
const els = {
  text: $('text'), ecl: $('ecl'), margin: $('margin'), fg: $('fg'), bg: $('bg'), scale: $('scale'),
  canvas: $('canvas'), ph: $('ph'), info: $('info'), count: $('count'), status: $('status'),
  scaleVal: $('scaleVal'), dlPng: $('dlPng'), dlSvg: $('dlSvg'), copy: $('copy'), toast: $('toast'),
};
const ECL_NAMES = ['L', 'M', 'Q', 'H'];
let current = null;

function toast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => els.toast.classList.remove('show'), 1600);
}

function opts() {
  return {
    margin: Math.max(0, Math.min(10, parseInt(els.margin.value, 10) || 0)),
    scale: parseInt(els.scale.value, 10),
    fg: els.fg.value, bg: els.bg.value,
  };
}

function render() {
  const text = els.text.value;
  const byteLen = new TextEncoder().encode(text).length;
  els.count.textContent = `${text.length} 字符 / ${byteLen} 字节`;
  els.status.textContent = '';
  els.status.className = '';
  const { margin, scale, fg, bg } = opts();

  if (!text) {
    current = null;
    els.canvas.hidden = true; els.ph.hidden = false; els.info.textContent = '';
    setButtons(false);
    updateScaleLabel();
    return;
  }
  try {
    current = QR.encode(text, parseInt(els.ecl.value, 10));
  } catch (e) {
    current = null;
    els.status.textContent = e.message; els.status.className = 'err';
    els.canvas.hidden = true; els.ph.hidden = false; els.info.textContent = '';
    setButtons(false);
    return;
  }
  const { size, modules } = current;
  const full = (size + margin * 2) * scale;
  const c = els.canvas, ctx = c.getContext('2d');
  c.width = c.height = full;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, full, full);
  ctx.fillStyle = fg;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
    if (modules[y][x]) ctx.fillRect((x + margin) * scale, (y + margin) * scale, scale, scale);
  c.style.width = c.style.height = Math.min(full, 340) + 'px';
  els.canvas.hidden = false; els.ph.hidden = true;
  els.info.textContent = `版本 ${current.version}（${size}×${size}）· 纠错 ${ECL_NAMES[current.ecl]} · 掩码 ${current.mask}`;
  setButtons(true);
  updateScaleLabel();
}

function updateScaleLabel() {
  const { margin, scale } = opts();
  const n = current ? current.size + margin * 2 : 0;
  els.scaleVal.textContent = current ? `${n * scale}×${n * scale} px（每模块 ${scale}px）` : `每模块 ${scale}px`;
}

function setButtons(on) { [els.dlPng, els.dlSvg, els.copy].forEach(b => (b.disabled = !on)); }

function download(href, name) {
  const a = document.createElement('a');
  a.href = href; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

function buildSvg() {
  const { margin, fg, bg } = opts();
  const { size, modules } = current;
  const n = size + margin * 2;
  let path = '';
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
    if (modules[y][x]) path += `M${x + margin},${y + margin}h1v1h-1z`;
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges">` +
    `<rect width="100%" height="100%" fill="${bg}"/><path d="${path}" fill="${fg}"/></svg>`;
}

els.dlPng.onclick = () => { if (current) download(els.canvas.toDataURL('image/png'), 'qrcode.png'); };
els.dlSvg.onclick = () => {
  if (!current) return;
  const url = URL.createObjectURL(new Blob([buildSvg()], { type: 'image/svg+xml' }));
  download(url, 'qrcode.svg');
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
els.copy.onclick = () => {
  if (!current) return;
  if (!navigator.clipboard || !window.ClipboardItem) { toast('当前浏览器不支持复制图片，请使用下载'); return; }
  els.canvas.toBlob(async blob => {
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      toast('已复制到剪贴板');
    } catch (e) { toast('复制失败：' + e.message); }
  }, 'image/png');
};

['input', 'change'].forEach(ev =>
  [els.text, els.ecl, els.margin, els.fg, els.bg, els.scale].forEach(el => el.addEventListener(ev, render)));
render();
</script>
</body>
</html>
